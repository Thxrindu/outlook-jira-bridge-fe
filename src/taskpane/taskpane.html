    <main id="app-body" style="display: none">
      <!-- App Header -->
      <header class="app-header">
        <div class="app-logo">🔗</div>

        <div>
          <h1>Outlook Jira Bridge</h1>

          <span> Create Jira issues from Outlook </span>
        </div>
      </header>

      <!-- Jira Account -->
      <section id="jira-account-section" class="card">
        <div class="card-header">
          <h3>Jira Account</h3>
        </div>

        <div class="jira-profile-container">
          <img
            id="jira-profile-image"
            src="https://th.bing.com/th/id/OIP.UyY5CqGveeDjZE70bosFiQHaHa?w=171&h=180&c=7&r=0&o=7&pid=1.7&rm=3"
            class="jira-profile-image"
          />

          <div class="jira-profile-details">
            <p id="jira-user-name" class="jira-user-name">Not signed in</p>

            <p id="jira-user-status" class="jira-user-status">Connect your Jira account</p>
          </div>
        </div>

        <button id="jira-login" class="secondary-button">Sign in to Jira</button>
      </section>

      <!-- Create Issue -->
      <section class="card">
        <div class="card-header">
          <h3>Create Jira Request</h3>
        </div>

        <!-- Jira Configuration -->

        <div class="section-label">Jira Configuration</div>

        <div class="form-group">
          <label> Project </label>

          <select id="projectId"></select>
        </div>

        <div class="form-group">
          <label> Issue Type </label>

          <select id="issueTypeId"></select>
        </div>

        <div class="section-label">Request Details</div>

        <div class="form-group">
          <label> Category </label>

          <select id="categoryId"></select>
        </div>

        <div class="form-group">
          <label> Component </label>

          <select id="componentId"></select>
        </div>

        <div class="form-group">
          <label> Reason </label>

          <textarea id="reason" rows="4" placeholder="Describe the request..."> </textarea>
        </div>

        <div class="section-label">Tracking Information</div>

        <div class="form-group">
          <label> Reference No. </label>

          <input id="referenceNo" type="text" placeholder="HD JOB NO" />
        </div>

        <div class="form-group">
          <label> Handler </label>

          <input
            id="handler"
            type="text"
            placeholder="Jira user will be loaded after login"
            readonly
          />
        </div>

        <button id="run" class="primary-button">🚀 Create Jira Issue</button>

        <div id="item-subject" class="output-card"></div>
      </section>
    </main>

    <div id="toast-container"></div>

    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-box">
        <div class="spinner"></div>

        <div id="loading-text">Loading...</div>
      </div>
    </div>
